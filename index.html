<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SOKO - Gaming World</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
        }

        :root {
            --primary: #00d4ff;
            --secondary: #7b2cbf;
            --accent: #ff006e;
            --gold: #ffd700;
            --dark: #0a0a0a;
            --glass: rgba(10, 10, 10, 0.55);
            --glow-color: rgba(0, 212, 255, 0.5);
            --light-color: #00d4ff;
        }

        html {
            scroll-behavior: smooth;
            overflow-x: hidden;
            width: 100%;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), url('A.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            color: #fff;
            overflow-x: hidden;
            min-height: 100vh;
            position: relative;
            line-height: 1.6;
            touch-action: manipulation;
            -webkit-text-size-adjust: 100%;
        }

        /* Toast Notification */
        .toast-container {
            position: fixed;
            top: 100px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10000;
            pointer-events: none;
        }

        .toast {
            background: rgba(10, 10, 10, 0.95);
            backdrop-filter: blur(20px);
            border: 2px solid var(--primary);
            border-radius: 20px;
            padding: 20px 40px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 10px 40px rgba(0, 212, 255, 0.4), inset 0 0 30px rgba(0, 212, 255, 0.1);
            animation: toastSlideIn 0.5s ease-out, toastFadeOut 0.5s ease-in 3.5s forwards;
            pointer-events: auto;
            min-width: 300px;
            justify-content: center;
        }

        .toast.success {
            border-color: #10b981;
            box-shadow: 0 10px 40px rgba(16, 185, 129, 0.4), inset 0 0 30px rgba(16, 185, 129, 0.1);
        }

        .toast.error {
            border-color: #ef4444;
            box-shadow: 0 10px 40px rgba(239, 68, 68, 0.4), inset 0 0 30px rgba(239, 68, 68, 0.1);
        }

        .toast-icon {
            font-size: 1.8rem;
            color: var(--primary);
        }

        .toast.success .toast-icon {
            color: #10b981;
        }

        .toast.error .toast-icon {
            color: #ef4444;
        }

        .toast-message {
            font-family: 'Cairo', sans-serif;
            font-weight: 700;
            font-size: 1.1rem;
        }

        @keyframes toastSlideIn {
            from {
                opacity: 0;
                transform: translateY(-50px) scale(0.8);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes toastFadeOut {
            to {
                opacity: 0;
                transform: translateY(-50px) scale(0.8);
            }
        }

        /* Loader */
        .loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--dark);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.8s, visibility 0.8s;
        }

        .loader.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .loader-logo {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 4px solid transparent;
            background: linear-gradient(var(--dark), var(--dark)) padding-box,
                        linear-gradient(135deg, var(--primary), var(--secondary), var(--accent)) border-box;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 30px;
            animation: rotate 3s linear infinite;
            box-shadow: 0 0 40px var(--glow-color);
        }

        .loader-logo::before {
            content: '';
            position: absolute;
            inset: 8px;
            border-radius: 50%;
            background: var(--dark);
        }

        .loader-logo span {
            position: relative;
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 0.9rem;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            z-index: 1;
        }

        @keyframes rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loader-text {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.5rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--primary), var(--secondary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 30px;
            letter-spacing: 5px;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(0.95); }
        }

        .loader-bar-container {
            width: 300px;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 15px;
        }

        .loader-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--primary), var(--secondary), var(--accent));
            border-radius: 10px;
            transition: width 0.3s ease;
            box-shadow: 0 0 20px var(--primary);
        }

        .loader-percentage {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            color: var(--primary);
            margin-bottom: 10px;
        }

        .loader-status {
            font-size: 0.9rem;
            color: rgba(255,255,255,0.7);
        }

        /* Marquee */
        .marquee-container {
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            padding: 12px 0;
            overflow: hidden;
            border-top: 1px solid rgba(0, 212, 255, 0.3);
            border-bottom: 1px solid rgba(0, 212, 255, 0.3);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .marquee-content {
            display: inline-block;
            white-space: nowrap;
            animation: marquee 25s linear infinite, gradient 5s ease infinite;
            font-family: 'Cairo', sans-serif;
            font-weight: 900;
            font-size: 1.5rem;
            letter-spacing: 3px;
            background: linear-gradient(90deg, var(--primary), var(--secondary), var(--accent), var(--gold), var(--primary));
            background-size: 300% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        @keyframes marquee {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }

        @keyframes gradient {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        /* Header */
        .header {
            padding: 30px 20px 20px;
            text-align: center;
            position: relative;
        }

        .profile-container {
            position: relative;
            display: inline-block;
            margin-bottom: 20px;
        }

        .profile-img {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            border: 4px solid transparent;
            background: linear-gradient(var(--dark), var(--dark)) padding-box,
                        linear-gradient(135deg, var(--primary), var(--secondary), var(--accent)) border-box;
            object-fit: cover;
            box-shadow: 0 0 40px var(--glow-color);
            animation: profileGlow 3s ease-in-out infinite;
        }

        @keyframes profileGlow {
            0%, 100% { box-shadow: 0 0 40px var(--glow-color); }
            50% { box-shadow: 0 0 60px var(--glow-color); }
        }

        .clock {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary), var(--gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 15px 0;
        }

        .clock-date {
            font-family: 'Cairo', sans-serif;
            font-size: 1rem;
            color: rgba(255,255,255,0.8);
            margin-bottom: 10px;
        }

        .username {
            font-family: 'Orbitron', sans-serif;
            font-size: 3.5rem;
            font-weight: 900;
            margin: 10px 0;
            letter-spacing: 6px;
            animation: sokoPulse 2s ease-in-out infinite, sokoColor 5s ease-in-out infinite;
        }

        @keyframes sokoPulse {
            0%, 100% { 
                transform: scale(1);
                text-shadow: 0 0 20px var(--primary), 0 0 40px var(--secondary);
            }
            50% { 
                transform: scale(1.05);
                text-shadow: 0 0 30px var(--accent), 0 0 60px var(--primary);
            }
        }

        @keyframes sokoColor {
            0% { color: var(--primary); }
            25% { color: var(--secondary); }
            50% { color: var(--accent); }
            75% { color: var(--gold); }
            100% { color: var(--primary); }
        }

        .header-subtitle {
            font-size: 1rem;
            color: rgba(255,255,255,0.85);
            margin-top: 8px;
            letter-spacing: 1.5px;
        }

        /* Navigation Tabs */
        .nav-tabs {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            padding: 15px 20px;
            margin: 15px auto;
            max-width: 1200px;
            position: sticky;
            top: 50px;
            z-index: 99;
        }

        .nav-tab {
            padding: 12px 24px;
            background: rgba(10, 10, 10, 0.7);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-radius: 50px;
            color: #fff;
            font-family: 'Cairo', sans-serif;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.4s ease;
            letter-spacing: 1.5px;
            position: relative;
            overflow: hidden;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-tab i {
            font-size: 1.1rem;
            color: var(--primary);
        }

        .nav-tab::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 212, 255, 0.3), transparent);
            transition: left 0.5s;
        }

        .nav-tab:hover::before {
            left: 100%;
        }

        .nav-tab:hover {
            transform: translateY(-3px);
            border-color: var(--primary);
            box-shadow: 0 10px 30px rgba(0, 212, 255, 0.4);
        }

        .nav-tab.active {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-color: transparent;
            box-shadow: 0 10px 30px rgba(123, 44, 191, 0.6);
            transform: translateY(-3px);
        }

        .nav-tab.active i {
            color: #fff;
        }

        /* Sections */
        .section {
            display: none;
            animation: fadeIn 0.6s ease-in-out;
            max-width: 1200px;
            margin: 25px auto;
            padding: 0 15px;
        }

        .section.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Glass Card with Theme */
        .glass-card {
            background: var(--glass);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 25px;
            padding: 30px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5), inset 0 0 30px var(--glow-color);
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .glass-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border-radius: 25px;
            padding: 2px;
            background: linear-gradient(135deg, var(--primary), var(--secondary), var(--accent));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        /* Section Titles */
        .section-title {
            font-family: 'Cairo', sans-serif;
            font-weight: 900;
            font-size: 2rem;
            margin-bottom: 25px;
            text-align: center;
            background: linear-gradient(135deg, var(--gold), var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
        }

        /* Album Container */
        .album-container {
            position: relative;
            width: 100%;
            height: 400px;
            border-radius: 20px;
            overflow: hidden;
            margin: 25px 0;
            box-shadow: 0 0 50px var(--glow-color);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .album-slide {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 1s ease-in-out;
            background-size: cover;
            background-position: center;
        }

        .album-slide.active {
            opacity: 1;
        }

        .album-slide::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, transparent 40%, rgba(0, 0, 0, 0.85));
        }

        .album-text {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 10;
            font-size: 1.5rem;
            font-weight: 700;
            text-shadow: 0 0 20px rgba(0, 0, 0, 0.9);
            color: var(--gold);
            letter-spacing: 2px;
            width: 90%;
        }

        .album-dots {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            z-index: 10;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.4);
            cursor: pointer;
            transition: all 0.3s;
        }

        .dot.active {
            background: var(--primary);
            transform: scale(1.4);
            box-shadow: 0 0 15px var(--primary);
        }

        /* Themes Section - Enhanced with Lighting Effects */
        .themes-container {
            display: grid;
            gap: 30px;
        }

        .color-picker-section {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 20px;
            padding: 25px;
            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        .color-picker-label {
            display: block;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            margin-bottom: 20px;
            color: var(--gold);
            font-size: 1.3rem;
            text-align: center;
        }

        .color-picker-wrapper {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
        }

        .color-btn {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            border: 3px solid rgba(255,255,255,0.3);
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .color-btn:hover {
            transform: scale(1.2);
            border-color: #fff;
            box-shadow: 0 0 25px currentColor;
        }

        .color-btn.active {
            border-color: #fff;
            box-shadow: 0 0 30px currentColor;
            transform: scale(1.15);
        }

        .color-btn[data-color="#00d4ff"] { background: #00d4ff; }
        .color-btn[data-color="#ff006e"] { background: #ff006e; }
        .color-btn[data-color="#ffd700"] { background: #ffd700; }
        .color-btn[data-color="#10b981"] { background: #10b981; }
        .color-btn[data-color="#a855f7"] { background: #a855f7; }
        .color-btn[data-color="#ef4444"] { background: #ef4444; }
        .color-btn[data-color="#06b6d4"] { background: #06b6d4; }
        .color-btn[data-color="#ffffff"] { background: #ffffff; }
        .color-btn[data-color="#f97316"] { background: #f97316; }
        .color-btn[data-color="#ec4899"] { background: #ec4899; }

        .effects-toggles {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .effect-toggle {
            background: rgba(255,255,255,0.05);
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 15px;
            padding: 18px 20px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
        }

        .effect-toggle::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 212, 255, 0.1), transparent);
            transition: left 0.5s;
        }

        .effect-toggle:hover::before {
            left: 100%;
        }

        .effect-toggle:hover {
            background: rgba(255,255,255,0.1);
            border-color: var(--primary);
            transform: translateY(-2px);
        }

        .effect-toggle.active {
            background: rgba(0, 212, 255, 0.15);
            border-color: var(--primary);
            box-shadow: 0 0 25px rgba(0, 212, 255, 0.3);
        }

        .effect-toggle i {
            font-size: 1.4rem;
            color: var(--primary);
            margin-left: 12px;
        }

        .effect-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .effect-name {
            font-family: 'Cairo', sans-serif;
            font-weight: 700;
            font-size: 1rem;
        }

        .toggle-switch {
            width: 55px;
            height: 28px;
            background: rgba(255,255,255,0.2);
            border-radius: 14px;
            position: relative;
            transition: all 0.3s;
        }

        .effect-toggle.active .toggle-switch {
            background: var(--primary);
            box-shadow: 0 0 15px var(--primary);
        }

        .toggle-switch::after {
            content: '';
            position: absolute;
            width: 24px;
            height: 24px;
            background: #fff;
            border-radius: 50%;
            top: 2px;
            right: 2px;
            transition: all 0.3s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }

        .effect-toggle.active .toggle-switch::after {
            right: 29px;
        }

        /* Lighting Effects CSS */
        .effect-rgb-border {
            position: relative;
        }

        .effect-rgb-border::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 25px;
            padding: 3px;
            background: linear-gradient(90deg, var(--light-color), var(--accent), var(--gold), var(--light-color));
            background-size: 300% 300%;
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            animation: rgbRotate 3s linear infinite;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .effect-rgb-border.active::before {
            opacity: 1;
        }

        @keyframes rgbRotate {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .effect-spotlight {
            position: relative;
        }

        .spotlight-element {
            position: absolute;
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, var(--light-color) 0%, transparent 70%);
            opacity: 0.4;
            pointer-events: none;
            transform: translate(-50%, -50%);
            filter: blur(20px);
            z-index: 1;
            transition: opacity 0.3s;
        }

        .effect-ambient {
            position: relative;
        }

        .effect-ambient::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 150%;
            height: 150%;
            background: radial-gradient(circle, var(--light-color) 0%, transparent 60%);
            opacity: 0.15;
            filter: blur(60px);
            z-index: -1;
            transition: opacity 0.3s;
        }

        .effect-ambient:not(.active)::before {
            opacity: 0;
        }

        .effect-holographic {
            position: relative;
            overflow: hidden;
        }

        .effect-holographic::after {
            content: '';
            position: absolute;
            top: -100%;
            left: -100%;
            width: 300%;
            height: 300%;
            background: linear-gradient(
                45deg,
                transparent 30%,
                rgba(255,255,255,0.1) 40%,
                var(--light-color) 50%,
                rgba(255,255,255,0.1) 60%,
                transparent 70%
            );
            transform: rotate(45deg);
            transition: all 0.6s;
            opacity: 0;
        }

        .effect-holographic:hover::after {
            animation: holographicShine 1.5s ease-out;
        }

        .effect-holographic:not(.active):hover::after {
            opacity: 0;
        }

        @keyframes holographicShine {
            0% {
                top: -100%;
                left: -100%;
                opacity: 0;
            }
            50% {
                opacity: 1;
            }
            100% {
                top: 100%;
                left: 100%;
                opacity: 0;
            }
        }

        .effect-pulse {
            animation: musicPulse 2s ease-in-out infinite;
            animation-play-state: paused;
        }

        .effect-pulse.active {
            animation-play-state: running;
        }

        @keyframes musicPulse {
            0%, 100% {
                box-shadow: 0 0 20px var(--glow-color), inset 0 0 30px var(--glow-color);
                transform: scale(1);
            }
            50% {
                box-shadow: 0 0 40px var(--glow-color), inset 0 0 50px var(--glow-color);
                transform: scale(1.02);
            }
        }

        .effect-particles {
            position: relative;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: var(--light-color);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--light-color);
            pointer-events: none;
            opacity: 0;
        }

        .effect-particles.active .particle {
            animation: floatParticle 3s ease-in-out infinite;
        }

        @keyframes floatParticle {
            0% {
                opacity: 0;
                transform: translateY(100%) scale(0);
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                opacity: 0;
                transform: translateY(-100px) scale(1);
            }
        }

        /* Theme Selector */
        .theme-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .theme-card {
            background: rgba(10, 10, 10, 0.6);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .theme-card:hover {
            transform: translateY(-5px);
            border-color: var(--primary);
        }

        .theme-card.active {
            border-color: var(--primary);
            box-shadow: 0 0 30px var(--glow-color);
            transform: translateY(-5px);
        }

        .theme-preview {
            width: 100%;
            height: 60px;
            border-radius: 10px;
            margin-bottom: 10px;
        }

        .theme-name {
            font-family: 'Cairo', sans-serif;
            font-weight: 700;
            font-size: 0.9rem;
        }

        /* Themes Colors */
        .theme-pink-purple { background: linear-gradient(135deg, #ec4899, #8b5cf6); }
        .theme-purple-pink { background: linear-gradient(135deg, #a855f7, #ec4899); }
        .theme-blue-purple { background: linear-gradient(135deg, #3b82f6, #a855f7); }
        .theme-cyan-pink { background: linear-gradient(135deg, #06b6d4, #ec4899); }
        .theme-green-cyan { background: linear-gradient(135deg, #10b981, #06b6d4); }
        .theme-orange-red { background: linear-gradient(135deg, #f97316, #ef4444); }
        .theme-yellow-orange { background: linear-gradient(135deg, #eab308, #f97316); }
        .theme-rose-pink { background: linear-gradient(135deg, #fb7185, #f472b6); }
        .theme-indigo-violet { background: linear-gradient(135deg, #6366f1, #8b5cf6); }
        .theme-teal-emerald { background: linear-gradient(135deg, #14b8a6, #10b981); }

        /* About Section */
        .about-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 35px;
            align-items: start;
        }

        .about-info {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 25px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .info-item {
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .info-item:last-child {
            border-bottom: none;
        }

        .info-label {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            color: var(--primary);
            margin-bottom: 5px;
            letter-spacing: 2px;
        }

        .info-value {
            font-family: 'Cairo', sans-serif;
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--gold);
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 20px;
        }

        .game-item {
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.1), rgba(123, 44, 191, 0.1));
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-radius: 15px;
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.3s;
        }

        .game-item:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px var(--glow-color);
            border-color: var(--primary);
        }

        .game-icon {
            width: 45px;
            height: 45px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: #fff;
        }

        .game-name {
            font-family: 'Cairo', sans-serif;
            font-weight: 700;
            font-size: 0.95rem;
            color: #fff;
        }

        /* Schedule Section */
        .schedule-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 15px;
            margin-top: 25px;
        }

        .schedule-card {
            background: rgba(10, 10, 10, 0.5);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .schedule-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 40px var(--glow-color);
            border-color: var(--primary);
        }

        .day-name {
            font-family: 'Cairo', sans-serif;
            font-weight: 700;
            font-size: 1.4rem;
            margin-bottom: 8px;
            color: var(--gold);
            letter-spacing: 2px;
        }

        .day-time {
            font-size: 1rem;
            color: var(--primary);
            font-weight: 600;
        }

        .day-icon {
            font-size: 2.2rem;
            margin-bottom: 10px;
            color: var(--accent);
        }

        /* Tips Section */
        .tips-container {
            display: grid;
            gap: 20px;
        }

        .tip-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 25px;
            transition: all 0.3s;
        }

        .tip-card:hover {
            transform: translateX(-10px);
            border-color: var(--primary);
            box-shadow: -5px 5px 20px var(--glow-color);
        }

        .tip-title {
            font-family: 'Cairo', sans-serif;
            font-weight: 700;
            font-size: 1.3rem;
            color: var(--accent);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .tip-content {
            font-size: 1rem;
            line-height: 1.8;
            color: rgba(255, 255, 255, 0.9);
        }

        .games-category {
            margin-top: 30px;
        }

        .category-title {
            font-family: 'Cairo', sans-serif;
            font-weight: 700;
            font-size: 1.5rem;
            color: var(--gold);
            margin-bottom: 20px;
            text-align: center;
        }

        /* Lighting Section */
        .lighting-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .lighting-card {
            background: rgba(10, 10, 10, 0.6);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .lighting-card::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: var(--light-color);
            filter: blur(20px);
            opacity: 0.6;
            transition: all 0.3s;
        }

        .lighting-card:hover::before {
            width: 80px;
            height: 80px;
            opacity: 0.8;
        }

        .lighting-card.active {
            border-color: var(--light-color);
            box-shadow: 0 0 40px var(--light-color), inset 0 0 30px var(--light-color);
            transform: translateY(-5px);
        }

        .lighting-card.active::before {
            width: 100px;
            height: 100px;
            opacity: 1;
        }

        .lighting-color {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            margin: 0 auto 10px;
            position: relative;
            z-index: 1;
            box-shadow: 0 0 20px var(--light-color);
        }

        .lighting-name {
            font-family: 'Cairo', sans-serif;
            font-weight: 700;
            font-size: 0.9rem;
            position: relative;
            z-index: 1;
        }

        /* Contact Form */
        .contact-form {
            max-width: 600px;
            margin: 0 auto;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            font-family: 'Cairo', sans-serif;
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--primary);
            margin-bottom: 10px;
            display: block;
        }

        .form-input,
        .form-textarea {
            width: 100%;
            padding: 15px 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            color: #fff;
            font-family: 'Cairo', sans-serif;
            font-size: 1rem;
            transition: all 0.3s;
            -webkit-user-select: text;
            user-select: text;
        }

        .form-input:focus,
        .form-textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 20px var(--glow-color);
            background: rgba(255, 255, 255, 0.08);
        }

        .form-textarea {
            min-height: 150px;
            resize: vertical;
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border: none;
            border-radius: 15px;
            color: #fff;
            font-family: 'Cairo', sans-serif;
            font-weight: 700;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .submit-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px var(--glow-color);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        /* Music Player */
        .music-player {
            position: fixed;
            bottom: 20px;
            left: 20px;
            right: 20px;
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 15px 25px;
            z-index: 1000;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5), inset 0 0 20px var(--glow-color);
            display: flex;
            align-items: center;
            gap: 20px;
            max-width: 600px;
            margin: 0 auto;
        }

        .music-player::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border-radius: 20px;
            padding: 2px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        .music-cover {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: #fff;
            animation: musicRotate 3s linear infinite;
            animation-play-state: paused;
        }

        .music-player.playing .music-cover {
            animation-play-state: running;
        }

        @keyframes musicRotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .music-info {
            flex: 1;
        }

        .music-title {
            font-family: 'Cairo', sans-serif;
            font-weight: 700;
            font-size: 1rem;
            color: var(--gold);
            margin-bottom: 5px;
        }

        .music-artist {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.7);
        }

        .music-controls {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .music-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .music-btn:hover {
            background: var(--primary);
            transform: scale(1.1);
            box-shadow: 0 0 15px var(--primary);
        }

        .music-btn.play {
            width: 50px;
            height: 50px;
            font-size: 1.3rem;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border: none;
        }

        .volume-control {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-left: 15px;
        }

        .volume-slider {
            width: 80px;
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            cursor: pointer;
            position: relative;
        }

        .volume-progress {
            height: 100%;
            width: 70%;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            border-radius: 10px;
            transition: width 0.3s;
        }

        /* Social Links */
        .social-links {
            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
            margin-top: 25px;
        }

        .social-btn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: #fff;
            text-decoration: none;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
            border: 2px solid transparent;
        }

        .social-btn.discord { background: linear-gradient(135deg, #5865F2, #4752C4); }
        .social-btn.tiktok { background: linear-gradient(135deg, #000000, #25F4EE); }
        .social-btn.spotify { background: linear-gradient(135deg, #1DB954, #1ed760); }
        .social-btn.roblox { background: linear-gradient(135deg, #de3838, #ff4444); }

        .social-btn:hover {
            transform: translateY(-10px) scale(1.1);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
            border-color: #fff;
        }

        /* Footer */
        .footer {
            text-align: center;
            padding: 25px;
            color: rgba(255,255,255,0.7);
            font-size: 0.9rem;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            margin-top: 40px;
            margin-bottom: 100px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .about-content {
                grid-template-columns: 1fr;
            }
            
            .username {
                font-size: 2.5rem;
            }
            
            .album-container {
                height: 280px;
            }
            
            .theme-grid,
            .lighting-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .effects-toggles {
                grid-template-columns: 1fr;
            }

            .music-player {
                flex-wrap: wrap;
                padding: 12px 15px;
                gap: 15px;
            }

            .volume-control {
                margin-left: 0;
                width: 100%;
                justify-content: center;
            }

            .nav-tab {
                padding: 9px 15px;
                font-size: 0.85rem;
            }
        }

        @media (max-width: 575px) {
            .marquee-content { font-size: 1.2rem; }
            .profile-img { width: 110px; height: 110px; }
            .clock { font-size: 1.4rem; }
            .username { font-size: 2rem; letter-spacing: 3px; }
            .nav-tab { padding: 9px 15px; font-size: 0.8rem; }
            .section-title { font-size: 1.6rem; }
            .album-container { height: 250px; }
            .schedule-grid { grid-template-columns: repeat(2, 1fr); }
            .games-grid { grid-template-columns: 1fr; }
            .theme-grid,
            .lighting-grid { grid-template-columns: repeat(2, 1fr); }
            .color-btn {
                width: 45px;
                height: 45px;
            }
        }

        /* ✨ NEW EFFECTS FROM SOKO IDEA LAB ✨ */
        /* Text Effects */
        .text-gradient {
            background: linear-gradient(135deg, var(--primary), var(--secondary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .text-glow {
            text-shadow: 0 0 10px var(--glow-color), 0 0 20px var(--glow-color);
        }

        .text-pulse {
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .text-3d {
            text-shadow: 0 0 10px rgba(0, 212, 255, 0.5), 0 0 20px rgba(0, 212, 255, 0.3);
        }

        .text-float {
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .text-shake {
            animation: shake 0.5s ease-in-out infinite;
        }

        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
            100% { transform: translateX(0); }
        }

        /* Glass Card Effects */
        .glass-card.glow {
            box-shadow: 0 0 40px var(--glow-color), inset 0 0 30px var(--glow-color);
        }

        .glass-card.pulse {
            animation: cardPulse 2s ease-in-out infinite;
        }

        @keyframes cardPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }

        /* Button Effects */
        .btn-glow {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            box-shadow: 0 0 20px var(--glow-color);
        }

        .btn-pulse {
            animation: btnPulse 2s ease-in-out infinite;
        }

        @keyframes btnPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .btn-ripple {
            position: relative;
            overflow: hidden;
        }

        .btn-ripple::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            animation: ripple 0.6s ease-out;
        }

        @keyframes ripple {
            to {
                width: 400px;
                height: 400px;
                opacity: 0;
            }
        }

        /* Particle Effects */
        .particles-container {
            position: relative;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            width: 5px;
            height: 5px;
            background: var(--light-color);
            border-radius: 50%;
            opacity: 0;
            animation: floatParticle 3s ease-in-out infinite;
        }

        @keyframes floatParticle {
            0% { transform: translateY(0) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            100% { transform: translateY(-100px) rotate(360deg); opacity: 0; }
        }

        /* Theme Switcher Effects */
        .theme-switcher {
            position: relative;
            overflow: hidden;
        }

        .theme-switcher::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            opacity: 0;
            transition: opacity 0.5s;
            z-index: -1;
        }

        .theme-switcher:hover::before {
            opacity: 0.2;
        }

        /* New Animations from SOKO IDEA LAB */
        .fade-in {
            animation: fadeIn 1s ease-in forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .slide-up {
            animation: slideUp 0.8s ease-out forwards;
        }

        @keyframes slideUp {
            from { transform: translateY(50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .zoom-in {
            animation: zoomIn 0.6s ease-out forwards;
        }

        @keyframes zoomIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .pulse-effect {
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        /* New Glass Card with SOKO Effects */
        .glass-card.soko-effect {
            position: relative;
            overflow: hidden;
        }

        .glass-card.soko-effect::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            opacity: 0;
            transition: opacity 0.5s;
            z-index: -1;
        }

        .glass-card.soko-effect:hover::before {
            opacity: 0.2;
        }

        .glass-card.soko-effect:hover {
            box-shadow: 0 0 60px var(--glow-color), inset 0 0 40px var(--glow-color);
        }

        /* New Text Effects */
        .text-3d-shadow {
            text-shadow: 0 0 10px rgba(0, 212, 255, 0.5), 0 0 20px rgba(0, 212, 255, 0.3);
        }

        .text-glow-shadow {
            text-shadow: 0 0 10px var(--glow-color), 0 0 20px var(--glow-color);
        }

        .text-ripple {
            position: relative;
            overflow: hidden;
        }

        .text-ripple::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transform: translateX(-100%);
            animation: ripple 2s linear infinite;
            pointer-events: none;
        }

        @keyframes ripple {
            to { transform: translateX(100%); }
        }

        /* New Button Effects */
        .btn-ripple-effect {
            position: relative;
            overflow: hidden;
        }

        .btn-ripple-effect::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            animation: ripple 0.6s ease-out;
        }

        @keyframes ripple {
            to {
                width: 400px;
                height: 400px;
                opacity: 0;
            }
        }

        /* New Card Effects */
        .card-3d {
            transform-style: preserve-3d;
            transition: transform 0.5s ease;
        }

        .card-3d:hover {
            transform: rotateY(10deg) rotateX(5deg);
        }

        .card-glow {
            box-shadow: 0 0 30px var(--glow-color);
